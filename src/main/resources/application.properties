spring.application.name=first-practice
spring.profiles.active=dev
# Boot reads .properties files as ISO-8859-1, so non-ASCII text must be written as unicode escapes.
# Below: "Hello, Amir! <Russian: This is my first> REST endpoint."
app.greeting.message=Hello, Amir! \u042D\u0442\u043E \u043C\u043E\u0439 \u043F\u0435\u0440\u0432\u044B\u0439 REST endpoint.
app.greeting.author=Zholdasali Amir
# true -> FormalGreetingFormatter bean is created and used
app.greeting.formal=false
